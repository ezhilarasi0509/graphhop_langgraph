name: kg-rag   # same project name as the earlier folder, so existing containers and data volumes are reused
services:
  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/kgrag-password
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kgrag
      POSTGRES_PASSWORD: kgrag
      POSTGRES_DB: kgrag
    ports: ["5433:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
volumes:
  neo4j_data:
  pg_data:
